models:
  - name: stg_users
    description: One row per user, with typed columns and a split address.
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
      - name: username_normalized
        description: Username with surrounding spaces removed and lowercase letters.
        data_tests:
          - unique
          - not_null
      - name: birthdate_is_valid
        description: Whether the original birthdate is no later than the first order.
        data_tests:
          - not_null
      - name: email
        data_tests:
          - unique
          - not_null
      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ["F", "M"]
      - name: state
        data_tests:
          - not_null

  - name: stg_orders
    description: One row per order after typing and deduplication.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: quantity
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: ["bread", "brioche", "cookie", "croissant", "donut", "drink"]
