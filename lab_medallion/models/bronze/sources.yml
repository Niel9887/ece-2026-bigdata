sources:
  - name: bronze
    description: Raw CSV files uploaded to the S3 bucket.
    config:
      meta:
        external_location: "read_csv('s3://{{ env_var('LAB_BUCKET_NAME') }}/bronze/{name}.csv', strict_mode = false)"
    tables:
      - name: users
        description: Generated users, one row per user.
      - name: orders
        description: Generated orders, one row per order.
