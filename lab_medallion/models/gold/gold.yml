models:
  - name: fct_orders
    description: One order with the user's state and region.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: region
        data_tests:
          - not_null

  - name: sales_by_region_month
    description: Monthly order and quantity totals by region and product, saved as Parquet.
    columns:
      - name: quantity
        data_tests:
          - not_null

  - name: dim_users
    description: One user with their state and order totals.
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null

  - name: best_product_by_region
    description: Product with the largest total quantity in each region.
    columns:
      - name: region
        data_tests:
          - unique
          - not_null
      - name: product
        data_tests:
          - not_null
      - name: total_quantity
        data_tests:
          - not_null
